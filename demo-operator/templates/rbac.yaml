apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-demo-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-demo-operator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-demo-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-demo-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-demo-operator
    namespace: {{ .Release.Namespace }}
