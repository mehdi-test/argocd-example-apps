apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-demo-operator
  labels:
    app.kubernetes.io/name: demo-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-operator
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Release.Name }}-demo-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--watch-configmaps"]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
