apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-loadbalancer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mehdi-test/argocd-example-apps.git
    targetRevision: HEAD
    path: helm-guestbook
    helm:
      values: |
        service:
          type: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-lb
